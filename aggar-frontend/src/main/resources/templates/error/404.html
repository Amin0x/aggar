<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${currentLanguage}" th:dir="${textDirection}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 غير موجود - Aggar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'arabic': ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        'primary': '#1E40AF',
                        'primary-light': '#3B82F6',
                        'primary-dark': '#1E3A8A',
                    }
                }
            }
        }
    </script>
</head>
<body class="font-arabic bg-gray-50">
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="min-h-screen flex items-center justify-center py-16">
        <div class="text-center">
            <div class="w-32 h-32 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-8">
                <i class="fas fa-exclamation-triangle text-6xl text-red-300"></i>
            </div>
            <h1 class="text-8xl font-bold text-gray-200 mb-4">404</h1>
            <h3 class="text-2xl font-bold text-gray-700 mb-3">العقار غير موجود</h3>
            <p class="text-gray-500 mb-8 max-w-md mx-auto">العقار الذي تبحث عنه غير موجود أو تم حذفه.</p>
            <div class="flex justify-center gap-4">
                <a th:href="@{/}" class="bg-primary text-white px-6 py-3 rounded-full hover:bg-primary-dark transition-all duration-300 font-semibold">
                    <i class="fas fa-home ml-2"></i> العودة للرئيسية
                </a>
                <a th:href="@{/properties}" class="bg-white text-primary border-2 border-primary px-6 py-3 rounded-full hover:bg-blue-50 transition-all duration-300 font-semibold">
                    <i class="fas fa-search ml-2"></i> تصفح العقارات
                </a>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
