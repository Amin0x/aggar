<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${currentLanguage}" th:dir="${textDirection}">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
<!-- Header Fragment -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Main Content -->
<div class="container mx-auto px-4 py-8">
    <!-- Page Title -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2" th:text="#{admin.properties.title}">Pending Properties</h1>
        <p class="text-gray-600" th:text="#{admin.properties.subtitle}">Review and approve or reject property submissions</p>
    </div>

    <!-- Success/Error Messages -->
    <div th:if="${success}" class="mb-6 bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-lg flex items-center">
        <i class="fas fa-check-circle ml-2"></i>
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="mb-6 bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-lg flex items-center">
        <i class="fas fa-exclamation-circle ml-2"></i>
        <span th:text="${error}"></span>
    </div>

    <!-- Properties List -->
    <div th:if="${properties != null and !properties.isEmpty()}" class="space-y-6">
        <div th:each="property : ${properties}" class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden hover:shadow-md transition-shadow">
            <div class="md:flex">
                <!-- Property Image -->
                <div class="md:w-1/3">
                    <img th:if="${property.images != null and !property.images.isEmpty()}" th:src="${property.images[0].url}"
                         alt="Property"
                         class="h-48 w-full object-cover md:h-full">
                    <div th:unless="${property.images != null and !property.images.isEmpty()}"
                         class="h-48 w-full bg-gray-200 flex items-center justify-center md:h-full">
                        <i class="fas fa-home text-4xl text-gray-400"></i>
                    </div>
                </div>

                <!-- Property Details -->
                <div class="p-6 md:w-2/3">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h2 class="text-xl font-semibold text-gray-800 mb-2" th:text="${property.title}">Property Title</h2>
                            <div class="flex items-center text-sm text-gray-500 space-x-4 space-x-reverse">
                                <span th:if="${property.listingType}">
                                    <i class="fas fa-tag ml-1"></i>
                                    <span th:text="${property.listingType}">Sale</span>
                                </span>
                                <span th:if="${property.category}">
                                    <i class="fas fa-building ml-1"></i>
                                    <span th:text="${property.category}">Apartment</span>
                                </span>
                                <span th:if="${property.price}">
                                    <i class="fas fa-dollar-sign ml-1"></i>
                                    <span th:text="${#numbers.formatDecimal(property.price, 0, 'COMMA', 0, 'POINT')}">450000</span>
                                    <span th:text="${property.currency}">USD</span>
                                </span>
                            </div>
                        </div>
                        <span class="px-3 py-1 bg-yellow-100 text-yellow-800 text-sm rounded-full" th:text="#{admin.properties.status.pending}">Pending</span>
                    </div>

                    <!-- Property Description -->
                    <p th:if="${property.description}" class="text-gray-600 text-sm mb-4 line-clamp-2" th:text="${property.description}">Description</p>

                    <!-- Property Details Grid -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4 text-sm">
                        <div th:if="${property.bedrooms}" class="flex items-center text-gray-600">
                            <i class="fas fa-bed ml-2 text-primary"></i>
                            <span th:text="${property.bedrooms + ' ' + #{admin.properties.bedrooms}}">3 Bedrooms</span>
                        </div>
                        <div th:if="${property.bathrooms}" class="flex items-center text-gray-600">
                            <i class="fas fa-bath ml-2 text-primary"></i>
                            <span th:text="${property.bathrooms + ' ' + #{admin.properties.bathrooms}}">2 Bathrooms</span>
                        </div>
                        <div th:if="${property.area}" class="flex items-center text-gray-600">
                            <i class="fas fa-expand-arrows-alt ml-2 text-primary"></i>
                            <span th:text="${property.area + ' m²'}">1200 m²</span>
                        </div>
                        <div th:if="${property.createdAt}" class="flex items-center text-gray-600">
                            <i class="fas fa-calendar ml-2 text-primary"></i>
                            <span th:text="${#temporals.format(property.createdAt, 'yyyy-MM-dd')}">2024-01-01</span>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex space-x-3 space-x-reverse pt-4 border-t">
                        <a th:href="@{'/properties/' + ${property.id}}" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
                            <i class="fas fa-eye ml-1"></i>
                            <span th:text="#{admin.properties.view}">View</span>
                        </a>
                        <form th:action="@{'/admin/properties/' + ${property.id} + '/approve'}" method="post" class="inline">
                            <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors">
                                <i class="fas fa-check ml-1"></i>
                                <span th:text="#{admin.properties.approve}">Approve</span>
                            </button>
                        </form>
                        <form th:action="@{'/admin/properties/' + ${property.id} + '/reject'}" method="post" class="inline">
                            <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors"
                                    onclick="return confirm(this.closest('form').dataset.confirmMessage || 'Are you sure you want to reject this property?')"
                                    th:attr="data-confirm-message=#{admin.properties.reject.confirm}">
                                <i class="fas fa-times ml-1"></i>
                                <span th:text="#{admin.properties.reject}">Reject</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${properties == null or properties.isEmpty()}" class="text-center py-16">
        <i class="fas fa-check-circle text-6xl text-green-400 mb-4"></i>
        <h3 class="text-2xl font-semibold text-gray-700 mb-2" th:text="#{admin.properties.no.pending}">No Pending Properties</h3>
        <p class="text-gray-500" th:text="#{admin.properties.all.approved}">All properties have been reviewed.</p>
    </div>

    <!-- Pagination -->
    <div th:if="${totalPages > 1}" class="mt-8 flex justify-center">
        <nav class="flex items-center space-x-2 space-x-reverse">
            <a th:if="${currentPage > 0}"
               th:href="@{/admin/properties(page=${currentPage - 1})}"
               class="px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                <i class="fas fa-chevron-right"></i>
            </a>
            <span th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}">
                <a th:if="${pageNum != currentPage}"
                   th:href="@{/admin/properties(page=${pageNum})}"
                   class="px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50"
                   th:text="${pageNum + 1}">1</a>
                <span th:if="${pageNum == currentPage}"
                      class="px-4 py-2 bg-primary text-white rounded-lg"
                      th:text="${pageNum + 1}">1</span>
            </span>
            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/admin/properties(page=${currentPage + 1})}"
               class="px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                <i class="fas fa-chevron-left"></i>
            </a>
        </nav>
    </div>
</div>

<!-- Footer Fragment -->
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
