<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${currentLanguage}" th:dir="${textDirection}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="#{header.brand} + ' - الأحياء'">Neighborhoods - Aggar</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { 'arabic': ['Cairo', 'sans-serif'] }, colors: { 'primary': '#1E40AF', 'accent': '#F59E0B' } } }
        }
    </script>

    <style>
        body { font-family: 'Cairo', sans-serif; }
        .reveal { opacity: 0; transform: translateY(20px); transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .reveal.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="bg-gray-50 font-arabic antialiased">

    <div th:replace="~{fragments/header :: header}"></div>

    <section class="pt-32 pb-16 bg-gradient-to-br from-green-600 via-green-700 to-emerald-800 text-white relative overflow-hidden">
        <div class="container mx-auto px-4 relative z-10">
            <div class="max-w-3xl mx-auto text-center">
                <div class="inline-flex items-center bg-white/10 glass rounded-full px-6 py-2.5 mb-6">
                    <i class="fas fa-road text-accent ml-2"></i>
                    <span class="text-white/90 text-sm font-medium">إدارة الأحياء</span>
                </div>
                <h1 class="text-4xl md:text-5xl font-black mb-6">ال<span class="text-accent">أحياء</span></h1>
                <p class="text-xl text-white/80">إدارة الأحياء في النظام</p>
            </div>
        </div>
        <div class="absolute bottom-0 left-0 right-0">
            <svg viewBox="0 0 1440 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 80L1440 80L1440 0C1200 40 960 60 720 60C480 60 240 40 0 0L0 80Z" fill="#F9FAFB"/>
            </svg>
        </div>
    </section>

    <section class="py-12 bg-gray-50">
        <div class="container mx-auto px-4">
            <div class="max-w-6xl mx-auto">

                <div th:if="${param.success}" class="mb-6 bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-lg flex items-center reveal">
                    <i class="fas fa-check-circle text-2xl ml-4"></i>
                    <span th:text="${param.success}">Success</span>
                </div>
                <div th:if="${param.error}" class="mb-6 bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-lg flex items-center reveal">
                    <i class="fas fa-exclamation-circle text-2xl ml-4"></i>
                    <span th:text="${param.error}">Error</span>
                </div>

                <div class="flex items-center justify-between mb-8 reveal">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900">قائمة الأحياء</h2>
                        <p class="text-gray-500 mt-1" th:text="'يوجد ' + ${#lists.size(neighborhoods)} + ' حي'">0 حي</p>
                    </div>
                    <a th:href="@{/neighborhoods/add}" class="bg-primary text-white px-5 py-2.5 rounded-full font-semibold hover:bg-primary-dark transition-all duration-300 shadow-sm">
                        <i class="fas fa-plus-circle ml-1"></i>
                        <span>إضافة حي</span>
                    </a>
                </div>

                <div class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden reveal">
                    <div th:if="${neighborhoods == null or #lists.isEmpty(neighborhoods)}" class="p-12 text-center">
                        <i class="fas fa-road text-6xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500 text-lg">لا توجد أحياء حالياً</p>
                    </div>

                    <div th:unless="${neighborhoods == null or #lists.isEmpty(neighborhoods)}" class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gray-50 border-b border-gray-100">
                                <tr>
                                    <th class="px-6 py-4 text-right text-sm font-semibold text-gray-700">#</th>
                                    <th class="px-6 py-4 text-right text-sm font-semibold text-gray-700">الحي</th>
                                    <th class="px-6 py-4 text-right text-sm font-semibold text-gray-700">المدينة</th>
                                    <th class="px-6 py-4 text-center text-sm font-semibold text-gray-700">الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                <tr th:each="n, iterStat : ${neighborhoods}" class="hover:bg-gray-50 transition-colors">
                                    <td class="px-6 py-4 text-sm text-gray-500" th:text="${iterStat.count}">1</td>
                                    <td class="px-6 py-4">
                                        <div class="flex items-center">
                                            <div class="w-10 h-10 bg-green-50 rounded-xl flex items-center justify-center ml-3">
                                                <i class="fas fa-road text-green-600"></i>
                                            </div>
                                            <span class="font-medium text-gray-900" th:text="${n.name}">Neighborhood</span>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4">
                                        <span class="px-3 py-1 bg-gray-100 text-gray-700 rounded-full text-sm" th:text="${n.cityName}">City</span>
                                    </td>
                                    <td class="px-6 py-4">
                                        <div class="flex items-center justify-center space-x-2 space-x-reverse">
                                            <a th:href="@{'/neighborhoods/edit/' + ${n.id}}" class="px-4 py-2 bg-yellow-50 text-yellow-700 rounded-lg hover:bg-yellow-100 transition-colors text-sm font-medium">
                                                <i class="fas fa-edit ml-1"></i> تعديل
                                            </a>
                                            <form th:action="@{'/neighborhoods/delete/' + ${n.id}}" method="post" class="inline" onsubmit="return confirm(this.dataset.confirmMsg || 'Are you sure?')" th:attr="data-confirm-msg=#{add.neighborhood.delete.confirm}">
                                                <button type="submit" class="px-4 py-2 bg-red-50 text-red-700 rounded-lg hover:bg-red-100 transition-colors text-sm font-medium">
                                                    <i class="fas fa-trash ml-1"></i> حذف
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        const revealElements = document.querySelectorAll('.reveal');
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        revealElements.forEach(el => revealObserver.observe(el));
    </script>
</body>
</html>
