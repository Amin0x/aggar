<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${currentLanguage}" th:dir="${textDirection}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="#{header.brand} + ' - ' + #{login.sign.in}">إنشاء حساب - Aggar</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'arabic': ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        'primary': '#1E40AF',
                        'primary-light': '#3B82F6',
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 font-arabic min-h-screen flex flex-col">
<div class="absolute top-4 left-4">
    <a th:href="${languageSwitchUrl}"
       class="text-sm font-semibold text-primary"
       th:text="${currentLanguage == 'ar' ? 'English' : 'العربية'}">English</a>
</div>
<!-- Main Content -->
<div class="flex-1 flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-2xl">
        <div class="bg-white border border-gray-200 rounded-3xl shadow-sm overflow-hidden">
            <!-- Header Banner -->
            <div class="bg-gradient-to-l from-primary to-primary-light p-8 text-white text-center">
                <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-user-plus text-2xl"></i>
                </div>
                <h2 class="text-3xl font-bold mb-2">إنشاء حساب جديد</h2>
                <p class="opacity-90">انضم إلى أجار وابدأ رحلتك العقارية</p>
            </div>

            <div class="p-8 md:p-12">
                <!-- Error Message -->
                <div th:if="${errorMessage}" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl mb-6 flex items-center">
                    <i class="fas fa-exclamation-circle ml-2"></i>
                    <span th:text="${errorMessage}">Error message</span>
                </div>

                <form th:action="@{/register}" method="post" id="registrationForm" class="space-y-6">
                    <!-- Personal Information -->
                    <div>
                        <h4 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                            <div class="w-8 h-8 bg-primary/10 text-primary rounded-lg flex items-center justify-center ml-2">
                                <i class="fas fa-user"></i>
                            </div>
                            المعلومات الشخصية
                        </h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="firstName" class="block text-sm font-semibold text-gray-700 mb-2">
                                    الاسم الأول <span class="text-red-500">*</span>
                                </label>
                                <input type="text" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:outline-none transition-colors" id="firstName" name="firstName" placeholder="أدخل اسمك الأول" required>
                            </div>
                            <div>
                                <label for="lastName" class="block text-sm font-semibold text-gray-700 mb-2">
                                    الاسم الأخير <span class="text-red-500">*</span>
                                </label>
                                <input type="text" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:outline-none transition-colors" id="lastName" name="lastName" placeholder="أدخل اسمك الأخير" required>
                            </div>
                        </div>
                        <div class="mt-4">
                            <label for="phone" class="block text-sm font-semibold text-gray-700 mb-2">
                                رقم الهاتف <span class="text-red-500">*</span>
                            </label>
                            <div class="relative">
                                <i class="fas fa-phone absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input type="tel" class="w-full pr-12 px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:outline-none transition-colors" id="phone" name="phone" placeholder="+966 5X XXX XXXX" required>
                            </div>
                        </div>
                    </div>

                    <!-- Account Information -->
                    <div>
                        <h4 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                            <div class="w-8 h-8 bg-primary/10 text-primary rounded-lg flex items-center justify-center ml-2">
                                <i class="fas fa-key"></i>
                            </div>
                            معلومات الحساب
                        </h4>
                        <div class="space-y-4">
                            <div>
                                <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">
                                    اسم المستخدم <span class="text-red-500">*</span>
                                </label>
                                <div class="relative">
                                    <i class="fas fa-at absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                    <input type="text" class="w-full pr-12 px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:outline-none transition-colors" id="username" name="username" placeholder="اختر اسم مستخدم" required>
                                </div>
                                <p class="text-xs text-gray-500 mt-1">يجب أن يكون اسم المستخدم فريداً وطوله 3 أحرف على الأقل</p>
                            </div>

                            <div>
                                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
                                    البريد الإلكتروني <span class="text-red-500">*</span>
                                </label>
                                <div class="relative">
                                    <i class="fas fa-envelope absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                    <input type="email" class="w-full pr-12 px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:outline-none transition-colors" id="email" name="email" placeholder="أدخل بريدك الإلكتروني" required>
                                </div>
                            </div>

                            <div>
                                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                                    كلمة المرور <span class="text-red-500">*</span>
                                </label>
                                <div class="relative">
                                    <i class="fas fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                    <input type="password" class="w-full pr-12 px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:outline-none transition-colors" id="password" name="password" placeholder="أنشئ كلمة مرور قوية" required minlength="8">
                                </div>
                                <div id="passwordStrength" class="mt-2 text-sm"></div>
                            </div>

                            <div>
                                <label for="confirmPassword" class="block text-sm font-semibold text-gray-700 mb-2">
                                    تأكيد كلمة المرور <span class="text-red-500">*</span>
                                </label>
                                <div class="relative">
                                    <i class="fas fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                    <input type="password" class="w-full pr-12 px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:outline-none transition-colors" id="confirmPassword" name="confirmPassword" placeholder="أعد إدخال كلمة المرور" required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Terms and Newsletter -->
                    <div class="bg-gray-50 p-6 rounded-xl space-y-3">
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" class="w-5 h-5 text-primary rounded focus:ring-primary" id="terms" required>
                            <span class="mr-2 text-sm text-gray-700">
                                أوافق على <a th:href="@{/terms-of-service}" target="_blank" class="text-primary hover:underline">شروط الاستخدام</a>
                                و <a th:href="@{/privacy-policy}" target="_blank" class="text-primary hover:underline">سياسة الخصوصية</a>
                            </span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" class="w-5 h-5 text-primary rounded focus:ring-primary" id="newsletter">
                            <span class="mr-2 text-sm text-gray-700">أرسل لي تحديثات العقارات وعروض حصرية عبر البريد الإلكتروني</span>
                        </label>
                    </div>

                    <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white py-4 rounded-xl font-semibold text-lg transition-colors flex items-center justify-center">
                        <i class="fas fa-user-plus ml-2"></i>
                        <span>إنشاء الحساب</span>
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <p class="text-gray-600">
                        هل لديك حساب بالفعل؟
                        <a th:href="@{/login}" class="text-primary font-semibold hover:text-primary-dark">سجل الدخول من هنا</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>


<script>
// Password strength checker
document.getElementById('password').addEventListener('input', function(e) {
    const password = e.target.value;
    const strengthElement = document.getElementById('passwordStrength');

    if (password.length === 0) {
        strengthElement.textContent = '';
        return;
    }

    let strength = 0;
    if (password.length >= 8) strength++;
    if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
    if (/[0-9]/.test(password)) strength++;
    if (/[^a-zA-Z0-9]/.test(password)) strength++;

    if (strength <= 1) {
        strengthElement.innerHTML = '<span class="text-red-500"><i class="fas fa-times-circle ml-1"></i> كلمة مرور ضعيفة</span>';
    } else if (strength === 2) {
        strengthElement.innerHTML = '<span class="text-yellow-500"><i class="fas fa-exclamation-circle ml-1"></i> كلمة مرور متوسطة</span>';
    } else {
        strengthElement.innerHTML = '<span class="text-green-500"><i class="fas fa-check-circle ml-1"></i> كلمة مرور قوية</span>';
    }
});

// Form validation
document.getElementById('registrationForm').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const terms = document.getElementById('terms').checked;

    if (password !== confirmPassword) {
        e.preventDefault();
        alert('كلمة المرور غير متطابقة!');
        return false;
    }

    if (!terms) {
        e.preventDefault();
        alert('يرجى الموافقة على الشروط والأحكام!');
        return false;
    }

    return true;
});
</script>
</body>
</html>
