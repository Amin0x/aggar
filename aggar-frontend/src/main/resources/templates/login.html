<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${currentLanguage}" th:dir="${textDirection}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="#{login.sign.in} + ' - Aggar'">تسجيل الدخول - Aggar</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'arabic': ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        'primary': '#1E40AF',
                        'primary-light': '#3B82F6',
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Cairo', sans-serif; }
        .login-bg {
            background-image: linear-gradient(rgba(30, 64, 175, 0.85), rgba(30, 64, 175, 0.85)), url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-gray-50 font-arabic min-h-screen flex flex-col">
<div class="absolute top-4 left-4">
    <a th:href="${languageSwitchUrl}"
       class="text-sm font-semibold text-primary"
       th:text="${currentLanguage == 'ar' ? 'English' : 'العربية'}">English</a>
</div>
<!-- Main Content -->
<div class="flex-1 flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-6xl">
        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 min-h-600">

                <!-- Left Side - Branding -->
                <div class="login-bg flex items-center justify-center p-12 text-white">
                    <div class="text-center">
                        <div class="mb-8">
                            <i class="fas fa-building text-6xl mb-6 opacity-90"></i>
                            <h2 class="text-4xl font-bold mb-4">مرحبًا بعودة</h2>
                            <p class="text-xl opacity-90 mb-8">سجل دخولك إلى حسابك في أجار</p>
                        </div>

                        <div class="space-y-4 text-right">
                            <div class="flex items-center justify-end space-x-3 space-x-reverse">
                                <span class="opacity-90">تصفح آلاف العقارات</span>
                                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                                    <i class="fas fa-search"></i>
                                </div>
                            </div>
                            <div class="flex items-center justify-end space-x-3 space-x-reverse">
                                <span class="opacity-90">احفظ عقاراتك المفضلة</span>
                                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                                    <i class="fas fa-heart"></i>
                                </div>
                            </div>
                            <div class="flex items-center justify-end space-x-3 space-x-reverse">
                                <span class="opacity-90">أضف عقارك بكل سهولة</span>
                                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                                    <i class="fas fa-plus-circle"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Side - Login Form -->
                <div class="p-8 md:p-12 flex items-center">
                    <div class="w-full">
                        <div class="text-center mb-8">
                            <h3 class="text-3xl font-bold text-gray-800 mb-2">تسجيل الدخول</h3>
                            <p class="text-gray-500">أدخل بياناتك للوصول إلى حسابك</p>
                        </div>

                        <!-- Error Message -->
                        <div th:if="${errorMessage}" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl mb-6 flex items-center">
                            <i class="fas fa-exclamation-circle ml-2"></i>
                            <span th:text="${errorMessage}">Error message</span>
                        </div>

                        <!-- Success Message -->
                        <div th:if="${message}" class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl mb-6 flex items-center">
                            <i class="fas fa-check-circle ml-2"></i>
                            <span th:text="${message}">Success message</span>
                        </div>

                        <form th:action="@{/login}" method="post" class="space-y-6">
                            <input type="hidden" name="redirect" th:if="${redirect != null}" th:value="${redirect}">
                            <div>
                                <label for="identifier" class="block text-sm font-semibold text-gray-700 mb-2">
                                    <i class="fas fa-user ml-1 text-primary"></i>
                                    <span th:text="#{login.email.username}">Email or Username</span>
                                </label>
                                <input type="text" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:outline-none transition-colors" id="identifier" name="identifier" th:placeholder="#{login.email.username}" autocomplete="username" required>
                            </div>

                            <div>
                                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                                    <i class="fas fa-lock ml-1 text-primary"></i>
                                    <span th:text="#{login.password}">Password</span>
                                </label>
                                <input type="password" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:outline-none transition-colors" id="password" name="password" th:placeholder="#{login.password}" required>
                            </div>

                            <div class="flex items-center justify-between">
                                <label class="flex items-center cursor-pointer">
                                    <input type="checkbox" class="w-4 h-4 text-primary rounded focus:ring-primary" id="rememberMe">
                                    <span class="mr-2 text-sm text-gray-600" th:text="#{login.remember.me}">Remember me</span>
                                </label>
                                <a href="#" class="text-sm text-primary hover:text-primary-dark" th:text="#{login.forgot.password}">Forgot password?</a>
                            </div>

                            <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white py-4 rounded-xl font-semibold text-lg transition-colors flex items-center justify-center">
                                <i class="fas fa-sign-in-alt ml-2"></i>
                                <span th:text="#{login.sign.in}">Sign In</span>
                            </button>
                        </form>

                        <div class="mt-8 text-center">
                            <p class="text-gray-600">
                                <span th:text="#{login.no.account}">Don't have an account?</span>
                                <a th:href="@{/register}" class="text-primary font-semibold hover:text-primary-dark" th:text="#{login.sign.up.now}">Sign up now</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


</body>
</html>
