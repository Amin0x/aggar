privacy.section2.2=Process property listings and transactions
privacy.section2.3=Communicate with you about our services
privacy.section2.4=Personalize your experience on our platform
privacy.section2.5=Improve our website and services
privacy.section2.6=Send marketing messages with your consent
privacy.section2.7=Comply with legal obligations
