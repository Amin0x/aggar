privacy.section7.content=Our website may contain links to third parties. We are not responsible for the privacy practices of external websites. Review their privacy policies before providing personal information.
privacy.section8.title=8. Children's Privacy
privacy.section8.content=Our services are not intended for children under 13. We do not knowingly collect personal information from children under 13. If we learn that we have collected such information, we will delete it promptly.
privacy.section9.title=9. International Data Transfers
privacy.section9.content=Your information may be transferred to and processed in countries other than your own. We ensure appropriate safeguards protect your information under applicable data protection laws.
