cookie.policy.title=Cookie Policy
cookie.policy.subtitle=This policy explains how Aggar Real Estate uses cookies and similar technologies to improve your experience.
cookie.effective.date=January 1, 2025
cookie.section1.title=1. What Are Cookies?
cookie.section1.content=Cookies are small text files stored on your device when you visit a website. They help the site remember your actions and preferences.
cookie.section2.title=2. How We Use Cookies
cookie.section2.intro=We use cookies for several purposes:
cookie.essential.short=Essential Cookies: Required for basic website functionality
cookie.performance.short=Performance Cookies: Help us understand how visitors use our site
cookie.functional.short=Functional Cookies: Remember your preferences and settings
cookie.targeting.short=Targeting Cookies: Deliver relevant advertisements and content
cookie.social.short=Social Media Cookies: Enable social media integration and sharing
cookie.section3.title=3. Types of Cookies We Use
cookie.essential.title=Essential
cookie.essential.content=These cookies are necessary for the website to function and cannot be switched off. They are generally set in response to actions you take on the site.
cookie.performance.title=Performance
cookie.performance.content=These cookies count visits and traffic sources so we can measure and improve site performance and understand which pages visitors use.
cookie.functional.title=Functional
cookie.functional.content=These cookies enable enhanced functionality and personalization. They may be set by us or by third-party providers whose services we use.
cookie.targeting.title=Targeting
cookie.targeting.content=These cookies may be set through our site by our advertising partners. They may be used to build a profile of your interests and show you relevant adverts on other sites.
cookie.section4.title=4. Detailed Cookie Information
