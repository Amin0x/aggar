privacy.section3.1=Property sellers and owners to facilitate transactions
privacy.section3.2=Service providers who help us operate our business
privacy.section3.3=Financial institutions to process mortgages and payments
privacy.section3.4=Authorities when required by law or to protect our rights
privacy.section3.5=Successors in connection with a merger, acquisition, or sale
privacy.section4.title=4. Data Security
privacy.section4.intro=We take appropriate security measures to protect your information:
privacy.section4.1=SSL encryption for data transmission
privacy.section4.2=Secure data storage systems
privacy.section4.3=Access controls and user authentication
privacy.section4.4=Regular security audits and updates
privacy.section4.5=Employee training on data protection
