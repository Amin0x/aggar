spring.application.name=frontend
server.port=8081
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=82MB
debug=true
external.api.properties-url=http://localhost:8080/api/properties
external.api.base-url=http://localhost:8080
external.api.location-url=http://localhost:8080/api
external.api.url=http://localhost:8080/api

# i18n configuration
spring.messages.basename=messages

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
