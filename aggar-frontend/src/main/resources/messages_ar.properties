cookie.section1.title=1. ما ملفات الارتباط؟
cookie.section1.content=ملفات الارتباط ملفات نصية صغيرة تُخزّن على جهازك عند زيارة موقع إلكتروني، وتساعد الموقع على تذكر تفضيلاتك وإجراءاتك.
cookie.section2.title=2. كيف نستخدم ملفات الارتباط
cookie.section2.intro=نستخدم ملفات الارتباط لأغراض متعددة:
cookie.essential.short=ملفات أساسية: ضرورية لوظائف الموقع الأساسية
cookie.performance.short=ملفات الأداء: تساعدنا على فهم كيفية استخدام الزوار للموقع
cookie.functional.short=ملفات وظيفية: تحفظ تفضيلاتك وإعداداتك
cookie.targeting.short=ملفات الاستهداف: تعرض إعلانات ومحتوى ملائمين
cookie.social.short=ملفات التواصل الاجتماعي: تتيح التكامل والمشاركة عبر شبكات التواصل
cookie.section3.title=3. أنواع ملفات الارتباط التي نستخدمها
cookie.essential.title=أساسية
cookie.essential.content=هذه الملفات ضرورية لعمل الموقع ولا يمكن إيقافها. وتُستخدم عادةً استجابةً للإجراءات التي تقوم بها على الموقع.
cookie.performance.title=الأداء
cookie.performance.content=تساعدنا هذه الملفات على قياس الزيارات ومصادرها لتحسين أداء الموقع ومعرفة الصفحات الأكثر استخدامًا.
cookie.functional.title=وظيفية
cookie.functional.content=تتيح هذه الملفات وظائف محسنة وتخصيصًا للتجربة. وقد نضعها نحن أو مزودو الخدمات الخارجيون الذين نستعين بهم.
cookie.targeting.title=الاستهداف
cookie.targeting.content=قد يضع شركاؤنا الإعلانيون ملفات الاستهداف عبر موقعنا. وقد تستخدمها هذه الشركات لإنشاء ملف عن اهتماماتك وعرض إعلانات ملائمة لك على مواقع أخرى.
